<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/og-image.png" />
        <title>画布TV</title>
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="画布TV" />
        <meta property="og:title" content="画布TV" />
        <meta property="og:description" content="AI 影视与短剧创作工作台" />
        <meta property="og:image" content="https://canvas.j11.net/og-image.png?v=1.5.48" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1024" />
        <meta property="og:image:height" content="683" />
        <meta property="og:url" content="https://canvas.j11.net/" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="画布TV" />
        <meta name="twitter:description" content="AI 影视与短剧创作工作台" />
        <meta name="twitter:image" content="https://canvas.j11.net/og-image.png?v=1.5.48" />
        <style>
            html {
                background: #0b0d09;
            }
            html,
            body {
                margin: 0;
            }
            body {
                background: inherit;
            }
            #root:empty {
                min-height: 100vh;
            }
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                background: rgba(255, 255, 255, 0.84);
                border-radius: 999px;
                box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.08);
                animation: appearance-bootstrap-pulse 1.8s ease-in-out infinite;
            }
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 82px;
                height: 82px;
                margin: -42px 0 0 -42px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-right-color: transparent;
                border-radius: 999px;
                animation: appearance-bootstrap-orbit 2.8s linear infinite;
            }
            @keyframes appearance-bootstrap-pulse { 0%, 100% { opacity: .62; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
            @keyframes appearance-bootstrap-orbit { to { transform: rotate(360deg); } }
            .mc-boot {
                position: fixed;
                inset: 0;
                background: #0b0d09 url("/manchuang/hero-vortex.webp") center / cover no-repeat;
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before,
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t !== "light");
                document.documentElement.style.colorScheme = t;
                document.documentElement.style.background = t === "light" ? "#ffffff" : "#0b0d09";
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root">
            <div class="mc-boot" aria-hidden="true"></div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
